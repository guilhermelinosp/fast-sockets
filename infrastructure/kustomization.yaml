# Tag da imagem: o workflow argocd ajusta (argocd app set --kustomize-image) ou edite aqui.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fast
resources:
- application.yaml
labels:
- pairs:
    app.kubernetes.io/instance: fast-sockets
  includeSelectors: false
images:
- name: ghcr.io/guilhermelinosp/fast-sockets
  newTag: v1.1.4
